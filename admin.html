<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Link Undangan</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #350202;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card-admin {
            background: #ffffff;
            color: #333333;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h2, h3 {
            margin-top: 0;
            color: #580816;
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
        }
        h2 { font-size: 1.35rem; }
        h3 { font-size: 1.15rem; margin-bottom: 16px; }

        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            color: #444;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 0.92rem;
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            line-height: 1.4;
        }
        .btn-main {
            width: 100%;
            padding: 12px;
            background-color: #580816;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }
        .btn-main:hover {
            background-color: #780b1e;
        }
        .btn-wa {
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.95rem;
        }
        .btn-wa:hover {
            background-color: #1ebc57;
        }
        .btn-copy-text {
            background-color: #4a5568;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-copy-text:hover {
            background-color: #2d3748;
        }
        .btn-share {
            background-color: #4a5568;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.95rem;
        }
        .btn-share:hover {
            background-color: #2d3748;
        }
        .btn-copy {
            background-color: #4a5568;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            margin-top: 6px;
        }
        .btn-reset {
            background: none;
            border: none;
            color: #c53030;
            font-size: 0.78rem;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            float: right;
        }
        .result-box {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px dashed #e2e8f0;
            display: none;
        }
        .copied-badge {
            color: #25D366;
            font-size: 0.82rem;
            font-weight: bold;
            display: none;
            margin-top: 4px;
            text-align: center;
        }
        .hint {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 4px;
        }

        /* --- STYLES MENU DAFTAR NAMA TAMU --- */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
            max-height: 350px;
            overflow-y: auto;
        }
        .history-item {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            color: #350202;
            font-size: 0.92rem;
        }
        .empty-history {
            text-align: center;
            color: #718096;
            font-size: 0.85rem;
            padding: 16px 0;
        }
    </style>
</head>
<body>

<div class="card-admin">
    <h2>Generator Link Undangan</h2>
    
    <div class="form-group">
        <label for="namaTamu">Nama Tamu / Penerima:</label>
        <input type="text" id="namaTamu" placeholder="Contoh: Budi Santoso & Partner">
    </div>

    <div class="form-group">
        <label for="noHp">Nomor WhatsApp Tamu (Opsional):</label>
        <input type="tel" id="noHp" placeholder="Contoh: 08123456789 atau 628123456789">
    </div>

    <div class="form-group">
        <label for="templateText">
            Template Kalimat Undangan:
            <button type="button" class="btn-reset" onclick="resetTemplate()">Reset ke Default</button>
        </label>
        <textarea id="templateText" rows="9"></textarea>
        <div class="hint">Gunakan <code>{nama}</code> untuk posisi nama tamu dan <code>{link}</code> untuk lokasi link undangan.</div>
    </div>

    <button type="button" class="btn-main" onclick="buatLink()">Buat Link & Teks WhatsApp</button>

    <div class="result-box" id="resultBox">
        <div class="form-group">
            <label>Link Undangan Khusus:</label>
            <input type="text" id="outputLink" readonly>
            <button type="button" class="btn-copy" onclick="salinLink()">📋 Salin Link</button>
            <div class="copied-badge" id="badgeSuccess">✓ Link berhasil disalin!</div>
        </div>

        <div class="form-group">
            <label>Hasil:</label>
            <textarea id="outputPesan" rows="10" readonly></textarea>
            <button type="button" class="btn-copy-text" onclick="salinPesanLengkap()">Salin Teks Undangan</button>
            <div class="copied-badge" id="badgePesanSuccess">✓ Teks undangan berhasil disalin!</div>
            <button type="button" class="btn-wa" id="btnKirimWA" onclick="kirimWA()">Kirim WhatsApp</button>
            <button type="button" class="btn-share" id="btnWebShare" onclick="bagikanKeApp()" style="display: none;">📲 Share</button>
        </div>
    </div>
</div>

<!-- KARTU WIDGET DAFTAR NAMA TAMU -->
<div class="card-admin">
    <h3>Daftar Tamu Dibuatkan Link (<span id="totalTamu">0</span>)</h3>
    <div class="history-list" id="historyContainer">
        <!-- Hanya list nama tamu yang akan tampil di sini -->
    </div>
</div>

<script>
    const baseURL = "https://invite-all.github.io/aldi-rahmah/";
    const scriptURL = "https://script.google.com/macros/s/AKfycbzSV7Y3VWWGSJTpQmtqxZkmhywpEu8Npii0_WpT98LUSb_VaON3frernSCmEShT2JB4/exec";

    const defaultTemplate = `*Assalamu’alaikum Warahmatullahi Wabarakatuh*
Kepada Yth. {nama}

Dengan segala kerendahan hati dan dengan ucapan syukur atas Rahmat Allah Subhanahu wa Ta’ala, kami bermaksud mengundang Bapak/Ibu/Saudara/i untuk hadir di acara pernikahan kami

*Detail Acara*
{link}

Merupakan suatu kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu pada hari yang berbahagia ini.
Terima kasih atas perhatiannya.

Kami yang berbahagia,

*Aldi & Rahmah*`;

    document.addEventListener("DOMContentLoaded", function () {
        const savedTemplate = localStorage.getItem("custom_invitation_template");
        document.getElementById("templateText").value = savedTemplate ? savedTemplate : defaultTemplate;

        if (navigator.share) {
            const btnShare = document.getElementById('btnWebShare');
            if (btnShare) btnShare.style.display = 'block';
        }

        // Ambil daftar tamu dari Google Sheets saat halaman dimuat
        tampilkanRiwayatDariSheets();
    });

    document.getElementById("templateText").addEventListener("input", function() {
        localStorage.setItem("custom_invitation_template", this.value);
    });

    function resetTemplate() {
        if (confirm("Kembalikan template kalimat ke format awal?")) {
            document.getElementById("templateText").value = defaultTemplate;
            localStorage.removeItem("custom_invitation_template");
        }
    }

    function buatLink() {
        const nama = document.getElementById('namaTamu').value.trim();
        let hp = document.getElementById('noHp').value.trim();
        const customTemplate = document.getElementById('templateText').value;

        if (!nama) {
            alert("Harap masukkan nama tamu!");
            return;
        }

        const encodedNama = encodeURIComponent(nama);
        const fullLink = `${baseURL}?to=${encodedNama}`;

        let pesanWA = customTemplate.replace(/\{nama\}/g, nama);
        pesanWA = pesanWA.replace(/\{link\}/g, fullLink);

        if (hp.startsWith('0')) {
            hp = '62' + hp.slice(1);
        }
        hp = hp.replace(/[^0-9]/g, '');

        document.getElementById('outputLink').value = fullLink;
        document.getElementById('outputPesan').value = pesanWA;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('badgeSuccess').style.display = 'none';

        document.getElementById('resultBox').setAttribute('data-hp', hp);

        // --- KIRIM KE GOOGLE SHEETS & REFRESH LIST NAMA ---
        if (scriptURL) {
            const formData = new FormData();
            formData.append('nama', nama);
            formData.append('hp', hp ? hp : '-');
            formData.append('link', fullLink);

            fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
                .then(() => {
                    console.log('Berhasil direkap ke Google Sheets');
                    setTimeout(tampilkanRiwayatDariSheets, 1000);
                })
                .catch(err => console.error('Gagal rekap:', err));
        }

        document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
    }

    function salinLink() {
        const inputLink = document.getElementById('outputLink');
        inputLink.select();
        inputLink.setSelectionRange(0, 99999);

        navigator.clipboard.writeText(inputLink.value).then(() => {
            const badge = document.getElementById('badgeSuccess');
            badge.style.display = 'block';
            setTimeout(() => {
                badge.style.display = 'none';
            }, 3000);
        });
    }

    function kirimWA() {
        const pesanAktif = document.getElementById('outputPesan').value;
        const hp = document.getElementById('resultBox').getAttribute('data-hp') || '';
        const encodedPesanWA = encodeURIComponent(pesanAktif);
        
        let targetWA = '';
        if (hp) {
            targetWA = `https://api.whatsapp.com/send?phone=${hp}&text=${encodedPesanWA}`;
        } else {
            targetWA = `https://api.whatsapp.com/send?text=${encodedPesanWA}`;
        }
        
        window.open(targetWA, '_blank');
    }

    function salinPesanLengkap() {
        const inputPesan = document.getElementById('outputPesan');
        inputPesan.select();
        inputPesan.setSelectionRange(0, 99999);

        navigator.clipboard.writeText(inputPesan.value).then(() => {
            const badge = document.getElementById('badgePesanSuccess');
            if (badge) {
                badge.style.display = 'block';
                setTimeout(() => { badge.style.display = 'none'; }, 3000);
            } else {
                alert("✓ Teks pesan undangan berhasil disalin!");
            }
        });
    }

    function bagikanKeApp() {
        const nama = document.getElementById('namaTamu').value.trim();
        const link = document.getElementById('outputLink').value;
        const pesan = document.getElementById('outputPesan').value;

        if (navigator.share) {
            navigator.share({
                title: `Undangan Pernikahan - ${nama}`,
                text: pesan,
                url: link
            }).catch((err) => console.log('Batal berbagi:', err));
        }
    }

    /* --- FUNGSI TAMPILKAN HANYA LIST NAMA DARI GOOGLE SHEETS --- */
    function tampilkanRiwayatDariSheets() {
        const container = document.getElementById('historyContainer');
        const totalElem = document.getElementById('totalTamu');

        if (!scriptURL) {
            container.innerHTML = `<div class="empty-history">URL Google Apps Script belum diisi.</div>`;
            return;
        }

        container.innerHTML = `<div class="empty-history">⏳ Memuat data dari Google Sheets...</div>`;

        fetch(scriptURL)
            .then(response => response.json())
            .then(riwayat => {
                totalElem.textContent = riwayat.length;

                if (riwayat.length === 0) {
                    container.innerHTML = `<div class="empty-history">Belum ada daftar tamu di Google Sheets.</div>`;
                    return;
                }

                // Urutkan nama dari yang terbaru ke terlama
                riwayat.reverse();

                let html = '';
                riwayat.forEach((item, index) => {
                    html += `
                        <div class="history-item">
                            ${index + 1}. ${item.nama}
                        </div>
                    `;
                });

                container.innerHTML = html;
            })
            .catch(err => {
                console.error("Gagal mengambil data dari Google Sheets:", err);
                container.innerHTML = `<div class="empty-history">⚠️ Gagal memuat data dari Google Sheets. Pastikan Web App diset ke "Anyone".</div>`;
            });
    }
</script>

</body>
</html>
